name: TikTok Platform CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install Dependencies
      run: npm install

    - name: Generate Prisma Client
      run: cd backend && npx prisma generate

    - name: Lint Backend
      run: cd backend && npx eslint . --ext .ts || echo "ESLint not fully configured yet, skipping failure"

    - name: Lint Frontend
      run: cd frontend && npm run lint || echo "ESLint not fully configured yet, skipping failure"

    - name: Build Backend
      run: cd backend && npx tsc --noEmit

    - name: Build Frontend
      run: cd frontend && npm run build

  # Add deployment jobs here for Phase 10
